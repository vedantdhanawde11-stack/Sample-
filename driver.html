<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ड्रायव्हर ड्युटी व GPS ट्रॅकर | बाळूमामा टूर्स</title>
  
  <link rel="icon" type="image/png" href="https://www.dropbox.com/scl/fi/hre9yos6r0pfnc8xjstlz/1787043134496.png?rlkey=kej6l3d66mod16vqpnotd2129&st=e2g9y5gr&raw=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto Sans Devanagari:wght@400;700&family=Times New Roman:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    :root {
      --gold-bright: #ffea00;
      --gold-main: #facc15;
      --cyan-neon: #00f0ff;
      --green-emerald: #22c55e;
      --red-alert: #ef4444;
      --bg-gradient: radial-gradient(circle at 50% 0%, #2e1065 0%, #1e1b4b 40%, #090d16 85%, #030712 100%);
      --glass-surface: rgba(255, 255, 255, 0.12);
      --glass-border: rgba(255, 255, 255, 0.28);
      --text-pure: #ffffff;
      --text-dim: #cbd5e1;
      --font-marathi: 'Noto Sans Devanagari', cursive, sans-serif;
      --font-english: 'Times New Roman', sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--font-marathi); -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg-gradient); color: var(--text-pure); min-height: 100vh; padding: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .eng-num { font-family: var(--font-english) !important; }
    .hidden { display: none !important; }

    .driver-card {
      width: 100%;
      max-width: 480px;
      background: var(--glass-surface);
      border: 1.5px solid var(--glass-border);
      backdrop-filter: blur(18px);
      border-radius: 24px;
      padding: 22px 18px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.6);
    }

    .header-box { text-align: center; margin-bottom: 16px; }
    .header-box img { width: 70px; height: 70px; border-radius: 16px; border: 2px solid var(--gold-bright); margin-bottom: 8px; }
    .header-box h2 { font-size: 1.35rem; color: var(--gold-bright); margin-bottom: 2px; }

    .booking-badge-row {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(0,0,0,0.5);
      border: 1.5px solid var(--gold-bright);
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 0.95rem;
      color: var(--gold-bright);
      font-weight: 800;
      margin-bottom: 14px;
    }

    .trip-info-box {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid var(--glass-border);
      border-radius: 18px;
      padding: 14px;
      margin-bottom: 16px;
      font-size: 0.95rem;
    }

    .info-line { margin-bottom: 6px; display: flex; justify-content: space-between; }
    .info-line strong { color: #fff; }

    .btn-gps-start {
      background: linear-gradient(180deg, #22c55e 0%, #15803d 100%);
      color: #fff;
      border: none;
      width: 100%;
      padding: 16px;
      border-radius: 16px;
      font-size: 1.25rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      box-shadow: 0 6px 20px rgba(34, 197, 94, 0.5);
      margin-bottom: 12px;
      transition: all 0.2s ease;
    }

    .btn-gps-stop {
      background: linear-gradient(180deg, #ef4444 0%, #b91c1c 100%);
      color: #fff;
      border: none;
      width: 100%;
      padding: 16px;
      border-radius: 16px;
      font-size: 1.25rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      box-shadow: 0 6px 20px rgba(239, 68, 68, 0.5);
      margin-bottom: 12px;
    }

    .status-meter {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
      margin-bottom: 14px;
    }

    .meter-box {
      background: rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 14px;
      padding: 10px;
      text-align: center;
    }
    .meter-box span { font-size: 0.8rem; color: var(--text-dim); display: block; }
    .meter-box strong { font-size: 1.2rem; color: var(--cyan-neon); }

    .pulse-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #22c55e;
      display: inline-block;
      box-shadow: 0 0 10px #22c55e;
      animation: pulse 1.5s infinite;
    }

    .btn-action-outline {
      background: rgba(0, 240, 255, 0.15);
      border: 1.5px solid var(--cyan-neon);
      color: var(--cyan-neon);
      padding: 11px;
      border-radius: 14px;
      text-decoration: none;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      font-size: 0.95rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.4); opacity: 0.6; } }
  </style>
</head>
<body>

  <div class="driver-card">
    <div class="header-box">
      <img src="https://www.dropbox.com/scl/fi/hre9yos6r0pfnc8xjstlz/1787043134496.png?rlkey=kej6l3d66mod16vqpnotd2129&st=e2g9y5gr&raw=1" alt="Logo">
      <h2>बाळूमामा टूर्स ड्रायव्हर ड्युटी</h2>
      <div class="booking-badge-row">
        <i class="fa-solid fa-id-card"></i> <span id="display-booking-id" class="eng-num">AV@-------</span>
      </div>
    </div>

    <!-- बुकिंग माहिती -->
    <div class="trip-info-box" id="duty-details">
      <p style="color:var(--text-dim); text-align:center;">बुकिंग माहिती लोड होत आहे...</p>
    </div>

    <!-- GPS कंट्रोल बटणे -->
    <button id="btn-start" class="btn-gps-start" onclick="startLiveTracking()">
      <i class="fa-solid fa-location-crosshairs"></i> प्रवास सुरू करा (GPS ON)
    </button>

    <button id="btn-stop" class="btn-gps-stop hidden" onclick="stopLiveTracking()">
      <i class="fa-solid fa-circle-stop"></i> प्रवास पूर्ण (GPS OFF)
    </button>

    <!-- थेट स्थिती मीटर -->
    <div class="status-meter">
      <div class="meter-box">
        <span>GPS स्थिती</span>
        <strong id="gps-status-text" style="font-size:0.95rem; color:#fca5a5;">बंद (OFF)</strong>
      </div>
      <div class="meter-box">
        <span>चालू वेग (Speed)</span>
        <strong id="live-speed" class="eng-num">0 km/h</strong>
      </div>
    </div>

    <!-- क्विक ॲक्शन्स -->
    <a id="btn-cust-call" href="#" class="btn-action-outline hidden">
      <i class="fa-solid fa-phone"></i> ग्राहकाला फोन करा
    </a>
    
    <a id="btn-nav-gmap" href="#" target="_blank" class="btn-action-outline hidden" style="border-color:var(--gold-bright); color:var(--gold-bright);">
      <i class="fa-solid fa-diamond-turn-right"></i> Google Maps नेव्हिगेशन सुरू करा
    </a>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCmLtQpzKq2wFg0nDZzAZyAXelGK_oNHGk",
  authDomain: "balumama-travels.firebaseapp.com",
  projectId: "balumama-travels",
  storageBucket: "balumama-travels.firebasestorage.app",
  messagingSenderId: "787861406325",
  appId: "1:787861406325:web:f31b27bcae1cd44baaee3c",
  measurementId: "G-N8VYSNG0VX"
    };

    let db = null;
    try {
      if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
      db = firebase.database();
    } catch(e) {}

    const urlParams = new URLSearchParams(window.location.search);
    const bookingId = urlParams.get('id'); // e.g. AV@0000001

    let watchId = null;
    let currentBooking = null;

    if (bookingId) {
      document.getElementById('display-booking-id').textContent = bookingId;
      
      if (db) {
        db.ref(`bookings/${bookingId}`).on('value', snap => {
          if (snap.exists()) {
            currentBooking = snap.val();
            renderDutyDetails(currentBooking);
          } else {
            document.getElementById('duty-details').innerHTML = '<p style="color:#ef4444; text-align:center;">❌ बुकिंग सापडली नाही. आयडी तपासा.</p>';
          }
        });
      }
    } else {
      document.getElementById('duty-details').innerHTML = `
        <div style="text-align:center; padding:10px 0;">
          <p style="margin-bottom:8px; font-size:0.9rem;">कृपया बुकिंग आयडी टाका (उदा. AV@0000001):</p>
          <input type="text" id="manual-id" placeholder="AV@0000001" class="eng-num" style="padding:10px; border-radius:10px; border:1.5px solid var(--gold-bright); width:100%; margin-bottom:10px; background:#000; color:#fff; text-align:center; font-weight:700;">
          <button onclick="window.location.search='?id='+document.getElementById('manual-id').value.trim()" style="background:var(--gold-bright); color:#000; padding:10px 20px; border:none; border-radius:10px; font-weight:700; cursor:pointer;">ड्युटी उघडा</button>
        </div>
      `;
    }

    function renderDutyDetails(b) {
      document.getElementById('duty-details').innerHTML = `
        <div style="color:var(--gold-bright); font-weight:700; font-size:1.1rem; margin-bottom:8px; border-bottom:1px solid rgba(255,255,255,0.15); padding-bottom:6px;">
          📍 ${b.routeFrom} ➡️ ${b.routeTo}
        </div>
        <div class="info-line"><span>👤 ग्राहक:</span> <strong>${b.name || '-'}</strong></div>
        <div class="info-line"><span>📞 ग्राहक फोन:</span> <strong class="eng-num">${b.phone || '-'}</strong></div>
        <div class="info-line"><span>🚗 गाडी:</span> <strong>${b.assignedVehicle || b.vehicle || '-'}</strong></div>
        <div class="info-line"><span>🚘 पासिंग क्र.:</span> <strong class="eng-num" style="color:var(--gold-bright);">${b.carNumber || '-'}</strong></div>
        <div class="info-line"><span>📅 तारीख:</span> <strong class="eng-num">${b.tripDate || '-'} (${b.days || '1'})</strong></div>
      `;

      if (b.phone) {
        const callBtn = document.getElementById('btn-cust-call');
        callBtn.href = `tel:${b.phone}`;
        callBtn.classList.remove('hidden');
      }

      const gmapBtn = document.getElementById('btn-nav-gmap');
      gmapBtn.href = `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(b.routeTo)}`;
      gmapBtn.classList.remove('hidden');
    }

    function startLiveTracking() {
      if (!navigator.geolocation) {
        alert('❌ तुमच्या मोबाईलमध्ये GPS सुविधा उपलब्ध नाही.');
        return;
      }

      if (!bookingId) {
        alert('❌ बुकिंग आयडी उपलब्ध नाही.');
        return;
      }

      document.getElementById('btn-start').classList.add('hidden');
      document.getElementById('btn-stop').classList.remove('hidden');
      document.getElementById('gps-status-text').innerHTML = '<span class="pulse-dot"></span> चालू (LIVE)';
      document.getElementById('gps-status-text').style.color = '#86efac';

      watchId = navigator.geolocation.watchPosition(
        pos => {
          const lat = pos.coords.latitude;
          const lng = pos.coords.longitude;
          const speed = pos.coords.speed ? Math.round(pos.coords.speed * 3.6) : 0;
          const heading = pos.coords.heading || 0;

          document.getElementById('live-speed').textContent = `${speed} km/h`;

          if (db && bookingId) {
            db.ref(`liveTracking/${bookingId}`).set({
              lat: lat,
              lng: lng,
              speed: speed,
              heading: heading,
              status: 'active',
              updatedAt: new Date().toISOString(),
              driverName: currentBooking?.driverName || 'ड्रायव्हर',
              carNumber: currentBooking?.carNumber || 'नवीन अर्टिगा'
            });
          }
        },
        err => {
          console.error(err);
          alert('कृपया मोबाईलचे Location Permission (GPS) Allow करा.');
        },
        { enableHighAccuracy: true, maximumAge: 2000, timeout: 10000 }
      );
    }

    function stopLiveTracking() {
      if (confirm('प्रवास पूर्ण झाला आहे का? GPS ट्रॅकिंग बंद करायचे का?')) {
        if (watchId) navigator.geolocation.clearWatch(watchId);

        if (db && bookingId) {
          db.ref(`liveTracking/${bookingId}/status`).set('ended');
        }

        document.getElementById('btn-start').classList.remove('hidden');
        document.getElementById('btn-stop').classList.add('hidden');
        document.getElementById('gps-status-text').textContent = 'बंद (OFF)';
        document.getElementById('gps-status-text').style.color = '#fca5a5';
        document.getElementById('live-speed').textContent = '0 km/h';
        alert('✅ प्रवास व ट्रॅकिंग यशस्वीरीत्या पूर्ण झाले!');
      }
    }
  </script>
</body>
</html>
